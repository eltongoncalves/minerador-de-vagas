<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV — Elton Gonçalves</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: #e2e8f0;
    min-height: 100vh;
  }

  /* ─── SELETOR DE TEMPLATES ─── */
  #switcher {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: #1e293b;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }
  #switcher span {
    color: #94a3b8;
    font-size: 12px;
    font-weight: 500;
    margin-right: 8px;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .tpl-btn {
    border: 2px solid #475569;
    background: transparent;
    color: #cbd5e1;
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .tpl-btn:hover { border-color: #94a3b8; color: #fff; }
  .tpl-btn.active { background: #2e7eed; border-color: #2e7eed; color: #fff; }

  .btn-export {
    margin-left: auto;
    background: #2e7eed;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 7px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
  }
  .btn-export:hover { background: #1a56a0; }
  .btn-export.loading { opacity: .7; cursor: wait; }

  #cv-wrapper {
    padding-top: 60px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }

  @media print {
    #switcher { display: none !important; }
    body { background: white; }
    #cv-wrapper { padding-top: 0; }
  }

  /* ══════════════════════════════════
     TEMPLATE 1 — CLÁSSICO (sidebar escura)
  ══════════════════════════════════ */
  #cv-container.t1 {
    width: 960px;
    max-width: 100%;
    background: white;
    box-shadow: 0 4px 40px rgba(0,0,0,.15);
    border-radius: 4px;
    overflow: hidden;
    margin: 24px 0 60px;
  }
  .t1 .cv-header {
    background: #0f2444;
    padding: 36px 40px;
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: center;
    gap: 20px;
  }
  .t1 .cv-name { font-size: 30px; font-weight: 700; color: #fff; }
  .t1 .cv-title { color: #7eb3f7; font-size: 13px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; margin-top: 6px; }
  .t1 .cv-contact { text-align: right; }

  .t1 .sidebar {
    background: #f8fafc;
    border-right: 1px solid #e2e8f0;
    padding: 28px 22px;
  }
  .t1 .sb-title {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #1a56a0; border-bottom: 2px solid #1a56a0;
    padding-bottom: 6px; margin-bottom: 14px; margin-top: 24px;

  .t1 .sb-title:first-child { margin-top: 0; }

  .t1 .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 6px; }
  .t1 .tag {
    background: #dbeafe; color: #1a56a0; border-radius: 4px;
    padding: 2px 8px; font-size: 11px; font-weight: 500;
  }
  .t1 .tag.plain { background: #f1f5f9; color: #475569; }
  .t1 .edu-item { margin-bottom: 12px; }
  .t1 .edu-degree { font-size: 12px; font-weight: 600; color: #1e293b; line-height: 1.4; }
  .t1 .edu-inst { font-size: 11px; color: #64748b; margin-top: 2px; }
  .t1 .award-item { display: flex; gap: 10px; margin-bottom: 14px; }
  .t1 .award-icon { font-size: 18px; flex-shrink: 0; }
  .t1 .award-title { font-size: 11.5px; font-weight: 600; color: #1e293b; line-height: 1.4; }
  .t1 .award-desc { font-size: 10.5px; color: #64748b; margin-top: 3px; line-height: 1.4; }
  .t1 .other-item { font-size: 12px; color: #475569; margin-bottom: 6px; }

  .t1 .main { padding: 28px 32px; }
  .t1 .sec-title {
    font-size: 10px; font-weight: 700; letter-spacing: .12em;
    text-transform: uppercase; color: #1a56a0;
    border-bottom: 2px solid #1a56a0; padding-bottom: 6px; margin-bottom: 18px;
  }
  .t1 section { margin-bottom: 28px; }
  .t1 .summary p { font-size: 13px; color: #374151; line-height: 1.7; margin-bottom: 10px; }
  .t1 .exp-item {
    padding-left: 14px;
    border-left: 3px solid #dbeafe;
    margin-bottom: 22px;
    page-break-inside: avoid; break-inside: avoid;
  }
  .t1 .exp-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 3px; }

  .t1 .exp-role { font-size: 12.5px; font-weight: 600; color: #1a56a0; margin-bottom: 5px; }
  .t1 .exp-context { font-size: 12px; color: #64748b; font-style: italic; margin-bottom: 8px; }
  .t1 .exp-case { font-size: 12px; font-weight: 600; color: #0f2444; margin: 8px 0 4px; }
  .t1 .exp-bullets { padding-left: 0; list-style: none; }
  .t1 .exp-bullets li { font-size: 12px; color: #374151; padding: 3px 0 3px 16px; position: relative; line-height: 1.5; page-break-inside: avoid; break-inside: avoid; }
  .t1 .exp-bullets li::before { content: '▸'; position: absolute; left: 0; color: #2e7eed; font-size: 10px; top: 5px; }
  .t1 .badge { background: #dcfce7; color: #166534; font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; margin-right: 4px; }
  .t1 .exp-stack { font-size: 11px; color: #64748b; margin-top: 8px; }

  .t1 .earlier-table th { text-align: left; color: #1a56a0; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-bottom: 2px solid #dbeafe; }
  .t1 .earlier-table td { padding: 6px 8px; color: #374151; border-bottom: 1px solid #f1f5f9; }
  .t1 .earlier-highlights { font-size: 11.5px; color: #475569; line-height: 1.6; margin-top: 10px; }

function renderExp(exp) {

let currentTemplate = 1;

const renderers = { 1: renderT1, 2: renderT2, 3: renderT3, 4: renderT4, 5: renderT5 };
const classNames = { 1: 't1', 2: 't2', 3: 't3', 4: 't4', 5: 't5' };

function setTemplate(n, btn) {
  currentTemplate = n;
  const container = document.getElementById('cv-container');
  container.className = classNames[n];
  container.innerHTML = renderers[n]();
  document.body.className = n === 4 ? 'dark-mode' : '';
  document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
}

/* ══════════════════════════════════
   EXPORTAR PDF
══════════════════════════════════ */
function exportarPDF(btn) {
  btn.classList.add('loading');
  btn.textContent = 'Gerando PDF…';

  const el = document.getElementById('cv-container');
  const orig = el.style.cssText;
  el.style.maxWidth = '100%';
  el.style.margin = '0';
  el.style.borderRadius = '0';
  el.style.boxShadow = 'none';

  const nomes = { 1: 'Classico', 2: 'Minimalista', 3: 'Moderno', 4: 'Dark', 5: 'Timeline' };

  html2pdf().set({
    margin: 0,
    filename: `Elton_Goncalves_CV_2026_${nomes[currentTemplate]}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, scrollY: -window.scrollY },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], avoid: ['.exp-item', '.award-item', '.sidebar-section', 'li'] }
  }).from(el).save().then(() => {
    el.style.cssText = orig;
    btn.classList.remove('loading');
    btn.innerHTML = '⬇ Exportar PDF';
  });
}

/* Init */
setTemplate(1, document.querySelector('.tpl-btn'));
